[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "normreport"
version = "0.1.0"
description = "Multi-backend normative brain-morphometry report generator (CentileBrain MFP + GAMLSS + PCN Toolkit)"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "phindagijimana"}]
keywords = ["neuroimaging", "normative-modeling", "brain-morphometry", "epilepsy", "clinical-decision-support"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.20",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "reportlab>=3.6",
    "click>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
normreport = "normreport.cli:main"

[project.urls]
"Repository" = "https://github.com/phindagijimana/normative"
"Bug Reports" = "https://github.com/phindagijimana/normative/issues"

[tool.setuptools.packages.find]
include = ["normreport*"]

[tool.setuptools.package-data]
normreport = ["data/*.csv"]
